<template>
    <div class="layout">
        <section class="panel">
            <h2 class="panel-title">Automation</h2>
            <template for:each={toggles} for:item="t">
                <div key={t.key} class="toggle-row">
                    <div>
                        <div class="toggle-label">{t.label}</div>
                        <div class="muted small">{t.help}</div>
                    </div>
                    <button
                        class={t.className}
                        data-key={t.key}
                        onclick={handleToggle}
                        role="switch"
                        aria-checked={t.checked}
                        aria-label={t.label}
                    >
                        <span class="knob"></span>
                        <span class="state">{t.state}</span>
                    </button>
                </div>
            </template>
        </section>

        <section class="panel">
            <h2 class="panel-title">Posting times (IST)</h2>
            <label class="label" for="morning">Morning slot</label>
            <input id="morning" class="field" type="time" data-key="morningSlot" value={values.morningSlot} onchange={handleTime} />
            <label class="label" for="midday">Midday slot (3 Reels/day only)</label>
            <input
                id="midday"
                class="field"
                type="time"
                data-key="middaySlot"
                value={values.middaySlot}
                onchange={handleTime}
                disabled={middayDisabled}
            />
            <label class="label" for="evening">Evening slot (2+ Reels/day)</label>
            <input
                id="evening"
                class="field"
                type="time"
                data-key="eveningSlot"
                value={values.eveningSlot}
                onchange={handleTime}
                disabled={eveningDisabled}
            />
            <p class="muted small note">Each Reel is generated before its slot; its format is picked from that day's trends.</p>
            <p class="muted small note">Repository: {values.repository}</p>
        </section>

        <section class="panel">
            <h2 class="panel-title">Posting limit</h2>
            <p class={postsUsedClass}>{postsUsedLabel}</p>
            <label class="label" for="dailyLimit">Max posts per 24 hours</label>
            <input id="dailyLimit" class="field" type="number" min="1" max="25" data-key="dailyPostLimit"
                value={values.dailyPostLimit} onchange={handleNumber} disabled={limitDisabled} />
            <label class="label" for="minGap">Minimum minutes between posts</label>
            <input id="minGap" class="field" type="number" min="0" max="720" data-key="minPostGap"
                value={values.minPostGap} onchange={handleNumber} disabled={limitDisabled} />
            <p class="muted small note">Reels over the limit are held (not failed) and can be approved again later.</p>
        </section>

        <section class="panel">
            <h2 class="panel-title">Trend watchlist</h2>
            <label class="label" for="watchlist">Public anime pages the research team watches daily (Instagram usernames, comma separated)</label>
            <textarea id="watchlist" class="field" rows="3" data-key="watchlist" value={values.watchlist} onchange={handleTime}></textarea>
            <p class="muted small note">Must be Business or Creator accounts. Pages of Reels you teach us with are good picks.</p>
        </section>
    </div>

    <template lwc:if={goingLive}>
        <div class="live">Live mode: Reels will be posted to Instagram automatically.</div>
    </template>
    <template lwc:if={error}><div class="error">{error}</div></template>

    <div class="save-bar">
        <template lwc:if={message}><span class="ok">{message}</span></template>
        <button class="btn btn_primary" onclick={handleSave} disabled={saveDisabled}>
            <template lwc:if={saving}>Saving…</template>
            <template lwc:else>Save settings</template>
        </button>
    </div>
</template>
