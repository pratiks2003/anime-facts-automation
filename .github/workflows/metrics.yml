name: Sync Instagram metrics

# Before each posting slot, so the Planner judges fresh numbers (odd minutes avoid GitHub's busiest slots). Also manual.
on:
  schedule:
    - cron: "47 1 * * *"   # 07:17 IST, before the morning plan (also runs the health check)
    - cron: "47 6 * * *"   # 12:17 IST, before the midday plan
    - cron: "47 12 * * *"  # 18:17 IST, before the evening plan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      IG_LOGIN: ${{ vars.IG_LOGIN }}
      SF_DOMAIN: ${{ vars.SF_DOMAIN }}
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Sync metrics to Salesforce
        run: python -m pipeline.metrics --days 30
      - name: Growth data - trending Instagram audio + audience hours (refreshes when older than 20 h)
        if: always()
        run: python -m pipeline.growth daily
      - name: Early warning (Instagram token / API access) - once a day
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '47 1 * * *')
        run: python -m pipeline.health
