<template>
    <div class="app">
        <div class="glow" aria-hidden="true"></div>
        <header class="top">
            <div class="brand">
                <div class="logo">先輩</div>
                <div class="titles">
                    <div class="name">Senpai Secrets</div>
                    <h1 class="page">{title}</h1>
                </div>
            </div>
            <span class={autopilotCls}><span class="dot pulse"></span>{autopilotLabel}</span>
        </header>

        <main class="main">
            <template lwc:if={error}>
                <div class="error-box">Couldn't load: {error}</div>
            </template>
            <template lwc:if={isToday}>
                <c-mc-today overview={overview} loading={loading} onopenreel={handleOpenReel} onrefresh={handleRefresh}></c-mc-today>
            </template>
            <template lwc:if={isReels}>
                <c-mc-reels overview={overview} loading={loading} onopenreel={handleOpenReel}></c-mc-reels>
            </template>
            <template lwc:if={isLive}>
                <c-mc-live reel-id={reelId}></c-mc-live>
            </template>
            <template lwc:if={isGrowth}>
                <c-mc-growth></c-mc-growth>
            </template>
            <template lwc:if={isMore}>
                <c-mc-more overview={overview}></c-mc-more>
            </template>
        </main>

        <nav class="tabbar" aria-label="Sections">
            <template for:each={tabs} for:item="t">
                <button key={t.id} class={t.cls} data-tab={t.id} onclick={handleTab} aria-current={t.current} aria-label={t.label}>
                    <span class="ico" aria-hidden="true">
                        <template lwc:if={t.isToday}>
                            <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5h4v5"/></svg>
                        </template>
                        <template lwc:if={t.isReels}>
                            <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>
                        </template>
                        <template lwc:if={t.isLive}>
                            <svg viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3h1V4z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 3h-1V4z"/></svg>
                        </template>
                        <template lwc:if={t.isGrowth}>
                            <svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="m5 15 4-4 3 3 7-7"/><path d="M15 7h4v4"/></svg>
                        </template>
                        <template lwc:if={t.isMore}>
                            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
                        </template>
                    </span>
                    <span class="lbl">{t.label}</span>
                    <template lwc:if={t.badge}><span class="badge">{t.badge}</span></template>
                </button>
            </template>
        </nav>
    </div>
</template>
