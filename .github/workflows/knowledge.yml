name: Refresh agent knowledge

# Keeps the Data Cloud library "Senpai_Knowledge" in sync with knowledge/*.jsonl. Salesforce only - never calls Instagram.
# Runs after renders too (reel.yml); this is the daily safety net. Also manual.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SF_DOMAIN: ${{ vars.SF_DOMAIN }}
      # the library needs an Agentforce-licensed user: a separate app that runs as the owner, used ONLY by this sync
      SF_CLIENT_ID: ${{ secrets.SF_KB_CLIENT_ID || secrets.SF_CLIENT_ID }}
      SF_CLIENT_SECRET: ${{ secrets.SF_KB_CLIENT_SECRET || secrets.SF_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the knowledge loader dependency
        run: pip install "$(grep '^rank-bm25' requirements.txt)"
      - name: Sync knowledge/*.jsonl to the Data Cloud library
        run: python -m tools.sync_knowledge
