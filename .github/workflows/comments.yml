name: Reply to comments

# Every 2 hours at :23 for all recent Reels, plus every 15 min for Reels in their first 2 hours
# (early replies are a ranking signal; that run makes no Instagram call when nothing was posted lately). Also manual.
on:
  schedule:
    - cron: "23 */2 * * *"
    - cron: "8,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comments
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      IG_LOGIN: ${{ vars.IG_LOGIN }}
      SF_DOMAIN: ${{ vars.SF_DOMAIN }}
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Reply to new comments
        env:
          FULL_RUN: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '23 */2 * * *' }}
        run: |
          if [ "$FULL_RUN" = "true" ]; then
            python -m pipeline.comments --days 14 --max-replies 30
          else
            python -m pipeline.comments --hours 2 --max-replies 20
          fi
