name: Learn from a Reel
run-name: "Analyze reference ${{ inputs.reference_id }}"

# Dispatched by Salesforce (ReferenceReels.Dispatch) when the admin pastes a public Reel link.
# The video is downloaded without login, measured, and deleted before the job ends; only numbers
# and the transcript go back to Salesforce.
on:
  workflow_dispatch:
    inputs:
      reference_id: { description: "Reference_Reel__c Id", required: true }
      url: { description: "Public Reel / Short URL", required: true }

permissions:
  contents: read

concurrency:
  group: analyze-${{ inputs.reference_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SF_DOMAIN: ${{ vars.SF_DOMAIN }}
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements-research.txt

      - name: Cache Whisper model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en-v1

      - name: Download, measure, delete
        env:
          IN_REFERENCE_ID: ${{ inputs.reference_id }}
          IN_URL: ${{ inputs.url }}
        run: python -m research.analyze_reel --reference-id "$IN_REFERENCE_ID" --url "$IN_URL"
