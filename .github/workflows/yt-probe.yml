name: YouTube access probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install yt-dlp==2026.11.23
      - name: Try official trailers (default settings, no cookies)
        run: |
          for id in vUjAxk1qYzQ RIyb52EMx8c YvNvvUeCztE tR8YH0G67Rk v4yLeNt-kCU rJo1MnsuxyY; do
            if yt-dlp -q --no-warnings -f "b[height<=720]/best" -o "/tmp/$id.%(ext)s" "https://www.youtube.com/watch?v=$id" 2>/tmp/err.txt; then
              echo "OK   $id $(du -h /tmp/$id.* | cut -f1)"
            else
              echo "FAIL $id $(head -c 200 /tmp/err.txt)"
            fi
          done
