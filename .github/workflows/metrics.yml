name: Sync Instagram metrics

# Daily at 07:17 IST (odd minute avoids GitHub's busiest scheduling slots). Also manual.
on:
  schedule:
    - cron: "47 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      IG_LOGIN: ${{ vars.IG_LOGIN }}
      SF_DOMAIN: ${{ vars.SF_DOMAIN }}
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Sync metrics to Salesforce
        run: python -m pipeline.metrics --days 30
      - name: Early warning (Instagram token expiry / API access)
        if: always()
        run: python -m pipeline.health
      - name: Refresh the agents' knowledge library (safety net)
        if: always()
        run: python -m tools.sync_knowledge
